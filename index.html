<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utsav</title>
<meta name="description" content="Walk into my room. Scroll through my years, and open the laptop on my desk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/motion.css">
<style>
:root{
  --ink:#1f1c18; --ink-2:#4d4740; --ink-3:#7c746a;
  --cream:#e7e3dc; --glass:rgba(255,253,249,.42); --glass-b:rgba(255,255,255,.65);
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
  --blur:blur(18px) saturate(1.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid #1f1c18;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--cream);transition:opacity .9s ease,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
#intro .box{text-align:center;width:min(300px,80vw)}
#intro h1{font:400 44px/1 var(--serif);margin:0 0 26px;letter-spacing:-.01em}
.load{height:2px;background:rgba(0,0,0,.12);overflow:hidden}
.load i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
#enter{margin-top:20px;border:0;background:none;color:var(--ink-2);font-size:15px;cursor:pointer;opacity:0;transition:opacity .4s;padding:8px 14px}
#enter.ready{opacity:1}
#enter:hover{color:var(--ink)}

/* ---------- glass ui ---------- */
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-b);box-shadow:0 8px 30px rgba(60,45,30,.10),inset 0 1px 0 rgba(255,255,255,.6)}
.ui{position:fixed;z-index:10;transition:opacity .5s,transform .5s}
body.hide-ui .ui:not(.keep){opacity:0;pointer-events:none}
.top{top:16px;left:16px;right:16px;display:flex;gap:8px;align-items:center}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:19px;height:19px}
.name{height:46px;border-radius:999px;padding:0 20px;display:flex;align-items:center;font:500 21px var(--serif);white-space:nowrap}
.top .sp{flex:1}
.name .av{width:32px;height:32px;border-radius:50%;object-fit:cover;margin:0 10px 0 -12px;border:2px solid rgba(255,255,255,.8)}
.social{display:flex;gap:8px}
.social a{text-decoration:none}
.tagline{top:72px;left:16px;right:16px;border-radius:999px;padding:11px 20px;font-size:14px;color:var(--ink-2)}
.card{left:16px;bottom:96px;width:min(560px,calc(100vw - 32px));border-radius:22px;padding:20px 24px 22px}
.meta{position:absolute;top:-40px;left:0;right:0;display:flex;justify-content:space-between;pointer-events:none}
.meta span{pointer-events:auto;font-size:13px;padding:6px 13px;border-radius:999px}
.card h2{font:400 30px/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.01em;padding-right:54px}
.card p{margin:0;color:var(--ink-2);font-size:15px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card .acts:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);cursor:pointer}
.pill:hover{background:#fff}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.card .go{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);cursor:pointer;text-decoration:none}
.card .go:hover{background:#fff}
.card.swap{animation:swap .5s ease}
@keyframes swap{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.hello{left:16px;bottom:var(--hello-b,300px);font-size:13.5px;padding:7px 14px;border-radius:999px}

.time{left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.years{display:flex;gap:2px;padding:5px;border-radius:999px}
.years button{border:0;background:none;padding:9px 13px;border-radius:999px;font-size:13.5px;color:var(--ink-3);cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.years button:hover{color:var(--ink)}
.years button.on{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hint{right:20px;bottom:96px;font-size:12.5px;color:var(--ink-3)}
.mp{right:16px;bottom:18px;display:flex;align-items:center;gap:8px;padding:7px 9px 7px 7px;border-radius:18px;width:330px}
.mp-art{border:0;padding:0;background:#ddd;width:44px;height:44px;border-radius:10px;overflow:hidden;cursor:pointer;flex:none}
.mp-art img{width:100%;height:100%;object-fit:cover;display:block}
.mp-meta{flex:1;min-width:0}.mp-meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-meta span{display:block;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-meta a{color:#c2410c;text-decoration:none;font-weight:600}
.mp-prog{height:3px;border-radius:3px;background:rgba(0,0,0,.1);margin-top:5px;overflow:hidden}.mp-prog i{display:block;height:100%;width:0;background:var(--ink)}
.mp-b{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:13px;flex:none}
.mp-b:hover{background:rgba(255,255,255,.7)}
.mp-play{background:var(--ink);color:#fff;width:36px;height:36px}.mp-play:hover{background:#000}
.mp-list{position:absolute;right:0;bottom:calc(100% + 8px);width:330px;max-height:360px;overflow:auto;border-radius:16px;padding:6px}
.mp-list button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px;border-radius:10px;cursor:pointer;text-align:left}
.mp-list button:hover,.mp-list button.on{background:rgba(255,255,255,.7)}
.mp-list img{width:36px;height:36px;border-radius:6px}
.mp-list b{display:block;font-size:12.5px}.mp-list span{font-size:11.5px;color:var(--ink-2)}

/* ---------- laptop overlay ---------- */
#mac{position:fixed;inset:0;z-index:30;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;background:#000}
#mac.open{opacity:1;visibility:visible}
#mac iframe{width:100%;height:100%;border:0;display:block}
#back{position:fixed;left:16px;top:40px;z-index:31;padding:13px 20px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;display:none;color:#fff;background:rgba(30,28,25,.55);border:1px solid rgba(255,255,255,.25);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#mac.open ~ #back{display:none}

/* hover label in 3D */
#tip{position:fixed;z-index:12;pointer-events:none;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;opacity:0;transform:translate(-50%,-140%);transition:opacity .2s;white-space:nowrap}
#tip.on{opacity:1}

@media (max-width:720px){
  .name{font-size:18px;padding:0 16px;height:42px}
  .round{width:42px;height:42px}
  .social a:not(.keep-sm){display:none}
  .tagline{top:66px;font-size:13px;border-radius:16px}
  .card{bottom:84px;padding:16px 18px 18px}
  .card h2{font-size:24px}
  .card p{font-size:14px}
  .hello{display:none}
  .years button{padding:8px 9px;font-size:12.5px}
  .hint{display:none}
  .mp{left:12px;right:12px;width:auto;bottom:74px}
  .mp-list{width:auto;left:0}
  .time{bottom:14px;width:calc(100vw - 24px);justify-content:center}
  .time .round{display:none}
}

/* ================= motion layer (Framer-style) ================= */
/* intro: name writes itself in, then the whole veil lifts with a blur */
#intro{transition:opacity .9s var(--ease-out),visibility .9s,scale 1.1s var(--ease-out),filter .9s var(--ease-out)}
#intro.gone{scale:1.06;filter:blur(14px)}
#intro h1{--stagger:70ms;--delay:120ms}
.load{border-radius:2px;animation:blur-in .8s .45s var(--ease-out) both}
.load i{transition:width .6s var(--spring-soft)}
#enter{translate:0 6px;transition:opacity .5s,translate var(--spring-d) var(--spring),color .2s;position:relative;border-radius:999px}
#enter.ready{translate:0 0}
#enter::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:currentColor;scale:0 1;transform-origin:left;transition:scale .5s var(--ease-out)}
#enter:hover::after{scale:1 1}

/* ui chrome: hidden until you come in, then staggers up out of a blur */
.ui{transition:opacity .6s var(--ease-out),translate var(--spring-d) var(--spring),filter .6s var(--ease-out)}
body.pre .ui{opacity:0;translate:0 18px;filter:blur(10px);pointer-events:none}
body.entering .ui{transition-delay:var(--d,0ms)}
.top{--d:0ms}.tagline{--d:80ms}.hello{--d:160ms}.card{--d:200ms}.time{--d:300ms}.hint{--d:380ms}.mp{--d:440ms}
body.hide-ui .ui:not(.keep){translate:0 10px;filter:blur(6px)}

.round,.pill,.mp-b,.card .go,.years button{transition:scale var(--spring-snap-d) var(--spring-snap),translate var(--spring-snap-d) var(--spring-snap),background-color .25s,color .25s,box-shadow .3s}
.round:hover,.card .go:hover{translate:0 -2px;box-shadow:0 12px 28px rgba(60,45,30,.16),inset 0 1px 0 rgba(255,255,255,.7)}
.round:active,.pill:active,.mp-b:active,.card .go:active,.years button:active{scale:.92}
.pill:hover{translate:0 -1px}
.card .go svg{transition:rotate .5s var(--spring)}
.card .go:hover svg{rotate:45deg}

/* dark pill: light sweeps across on hover */
.pill.dark{overflow:hidden;position:relative;isolation:isolate}
.pill.dark::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);translate:-120% 0;transition:translate .8s var(--ease-out)}
.pill.dark:hover::before{translate:120% 0}

/* story card: each stop springs in, title word by word */
.card.swap{animation:pop-in .7s var(--spring) both}
.card h2.split{--stagger:40ms}
.card.swap p{animation:blur-in .7s .12s var(--ease-out) both}
.card.swap .pill{animation:blur-in .6s var(--spring) both;animation-delay:calc(.22s + var(--i,0) * 60ms)}
.meta span{transition:opacity .4s,translate .6s var(--spring)}

/* year switcher: one pill that slides between years (shared-layout style) */
.years{position:relative}
.years .ind{position:absolute;top:5px;bottom:5px;left:0;width:var(--w,0);translate:var(--x,0) 0;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(0,0,0,.08),0 6px 16px rgba(60,45,30,.08);opacity:var(--o,0);transition:translate var(--spring-d) var(--spring),width var(--spring-d) var(--spring),opacity .3s;pointer-events:none}
.years button{position:relative;z-index:1}
.years button.on{background:none;box-shadow:none}

/* music: playlist opens like a popover from the cover art */
.mp-list[hidden]{display:block;opacity:0;scale:.94;translate:0 8px;filter:blur(6px);visibility:hidden;pointer-events:none}
.mp-list{transform-origin:bottom right;transition:opacity .25s var(--ease-out),scale .5s var(--spring),translate .5s var(--spring),filter .3s,visibility .3s}
.mp-art{transition:scale .5s var(--spring-snap)}
.mp-art:hover{scale:1.06}.mp-art:active{scale:.94}
.mp-prog i{transition:width .25s linear}
.mp-play{transition:scale .5s var(--spring-snap),background-color .2s}

/* 3D hover label */
#tip{scale:.85;transition:opacity .2s,scale .45s var(--spring)}
#tip.on{scale:1}

/* laptop: the screen grows to fill your view */
#mac{transition:opacity .6s var(--ease-out),visibility .6s}
#mac iframe{scale:.94;filter:blur(8px);transition:scale .9s var(--spring-soft),filter .6s var(--ease-out)}
#mac.open iframe{scale:1;filter:none}

@media (prefers-reduced-motion:reduce){
  body.pre .ui{translate:none;filter:none}
  .years .ind{transition:none}
}
</style>
</head>

<script>
/* -------- one music player for the room and the laptop -------- */
window.SharedPlayer = window.createPlayer();
(() => { const P = window.SharedPlayer, S = P.SONGS, $q = s => document.querySelector(s);
  const list = $q("#mpList");
  list.innerHTML = S.map((x,i) => `<button data-i="${i}"><img src="${x.art.replace("400x400","100x100")}" alt=""><div><b>${x.t}</b><span>${x.a}</span></div></button>`).join("");
  list.onclick = e => { const b = e.target.closest("[data-i]"); if (b){ P.play(+b.dataset.i); } };
  $q("#mpArt").onclick = () => list.hidden = !list.hidden;
  $q("#mpPlay").onclick = () => P.toggle(); $q("#mpNext").onclick = () => P.next(); $q("#mpPrev").onclick = () => P.prev();
  document.addEventListener("click", e => { if (!e.target.closest("#mp")) list.hidden = true; });
  const ui = tick => { const i = P.i < 0 ? 0 : P.i, x = S[i], a = P.audio;
    if (!tick){ $q("#mpArt img").src = x.art.replace("400x400","100x100"); $q("#mpT").textContent = P.i < 0 ? "Songs I build to" : x.t;
      $q("#mpA").innerHTML = P.i < 0 ? `${S.length} songs · tap play` : `${x.a} · <a href="${x.u}" target="_blank" rel="noopener">Full song ↗</a>${P.ended ? " · ended" : ""}`;
      $q("#mpPlay").textContent = a.paused ? "▶" : "❚❚";
      list.querySelectorAll("button").forEach((b,j) => b.classList.toggle("on", j === P.i)); }
    $q("#mpP").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%"; };
  P.on(ui); ui(); })();
</script>
<script>
/* split text into words (or letters) so each can blur in on its own beat */
window.splitText = (el, text, letters=false) => {
  el.classList.add("split"); el.setAttribute("aria-label", text); el.textContent = "";
  const parts = letters ? [...text] : text.split(/(\s+)/);
  let n = 0;
  parts.forEach(t => { if (/^\s+$/.test(t)) { el.append(t); return; }
    const w = document.createElement("span"); w.className = "w"; w.setAttribute("aria-hidden","true"); w.style.setProperty("--i", n++); w.textContent = t; el.append(w); });
};
splitText(document.querySelector("#intro h1"), "Utsav", true);
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

function wrapText(g, text, x, y, maxW, lh){ const words = text.split(" "); let line=""; for (const w of words){ const t = line ? line+" "+w : w; if (g.measureText(t).width > maxW && line){ g.fillText(line, x, y); y += lh; line = w; } else line = t; } g.fillText(line, x, y); return y; }

/* linen curtains, folded and tied back at both sides of the glass */
function curtain(x, flip){
  const w = .95, h = 3.0, segX = 60, segY = 8;
  const g = new THREE.PlaneGeometry(w, h, segX, segY), pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const px = pos.getX(i), py = pos.getY(i), t = (px + w/2) / w;      // 0..1 across
    const gather = 1 - .55 * Math.exp(-Math.pow((py + .25) / .5, 2));  // pinched where it's tied
    pos.setX(i, (px) * gather);
    pos.setZ(i, Math.sin(t * Math.PI * 9) * .045 * (0.6 + .4*gather) + (1-gather) * .05);
  }
  g.computeVertexNormals();
  const c = mesh(g, new THREE.MeshStandardMaterial({ color:0xece4d6, roughness:1, side:THREE.DoubleSide }));
  c.position.set(x, 1.56, backZ + .14); if (flip) c.scale.x = -1; scene.add(c);
  const tie = mesh(new THREE.TorusGeometry(.12, .012, 8, 24), M(0xa98b62,{ roughness:.6 })); tie.position.set(x, 1.31, backZ + .17); tie.scale.set(1.1,.35,1); scene.add(tie);
}

/* paintings: original abstract canvases on the right wall */
function painting(w, h, seed, pal){
  const tex = canvasTex(Math.round(w*700), Math.round(h*700), (g, W2, H2) => {
    let r = seed; const rnd = () => (r = (r*9301 + 49297) % 233280) / 233280;
    g.fillStyle = pal[0]; g.fillRect(0, 0, W2, H2);
    for (let i = 0; i < 9; i++){ g.fillStyle = pal[1 + (i % (pal.length-1))]; g.globalAlpha = .55 + rnd()*.4; g.beginPath();
      const cx = rnd()*W2, cy = rnd()*H2, rr = (.15 + rnd()*.35) * Math.min(W2,H2);
      g.ellipse(cx, cy, rr, rr*(.5 + rnd()), rnd()*3, 0, Math.PI*2); g.fill(); }
    g.globalAlpha = .9; g.strokeStyle = pal[pal.length-1]; g.lineWidth = Math.min(W2,H2)*.012; g.beginPath(); g.moveTo(W2*.1, H2*(.3+rnd()*.4)); g.bezierCurveTo(W2*.4, H2*rnd(), W2*.6, H2, W2*.92, H2*(.2+rnd()*.5)); g.stroke();
    g.globalAlpha = .08; for (let i = 0; i < 1600; i++){ g.fillStyle = rnd() > .5 ? "#000" : "#fff"; g.fillRect(rnd()*W2, rnd()*H2, 2, 2); }   // canvas grain
  });
  const grp = new THREE.Group();
  const frame = mesh(new RoundedBoxGeometry(w + .06, h + .06, .04, 2, .01), M(0xc8a07a,{ roughness:.55 })); grp.add(frame);
  const art = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map:tex, roughness:.85 })); art.position.z = .021; grp.add(art);
  return grp;
}

/* me: my own 3D avatar (made from my selfies on Avaturn), posed typing at the laptop */
function aim(person, name, child, dir){
  const b = person.getObjectByName(name), c = person.getObjectByName(child); if (!b || !c) return;
  person.updateMatrixWorld(true);
  const bp = b.getWorldPosition(new THREE.Vector3()), cp = c.getWorldPosition(new THREE.Vector3());
  const cur = cp.sub(bp).normalize(), want = new THREE.Vector3(...dir).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(cur, want);
  const bw = b.getWorldQuaternion(new THREE.Quaternion());
  const pw = b.parent.getWorldQuaternion(new THREE.Quaternion());
  b.quaternion.copy(pw.invert().multiply(q.multiply(bw)));
  person.updateMatrixWorld(true);
}

    g.fillStyle="#7c746a"; g.font="500 22px Inter, sans-serif"; g.fillText(fallbackSub, W2/2, H2-60);
  });
  mat.map = fallback;
  const tl = new THREE.TextureLoader();
  const tryLoad = (exts) => { if (!exts.length) return; tl.load(`photos/${i}.${exts[0]}`, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    const img = t.image, target = w/h, ar = img.width/img.height;
    if (ar > target){ t.repeat.set(target/ar,1); t.offset.set((1-target/ar)/2,0); } else { t.repeat.set(1,ar/target); t.offset.set(0,(1-ar/target)/2); }
    mat.map = t; mat.needsUpdate = true; }, undefined, () => tryLoad(exts.slice(1))); };
  tryLoad(["jpg","jpeg","png","webp"]);
  const g = new THREE.Group();
  const border = mesh(new THREE.BoxGeometry(w+.05, h+.05, .02), M(0xfaf7f2,{roughness:.7})); g.add(border);
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); pic.position.z = .011; g.add(pic);

  return g;
}

function photoMemory(key, src, title, sub, pos, rot, size){
  const c = document.createElement("canvas"); c.width = 600; c.height = 780;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const img = new Image();
  img.onload = () => { const g = c.getContext("2d");
    g.fillStyle = "#fffdf9"; g.beginPath(); g.roundRect(0,0,600,780,28); g.fill();
    const bw = 552, bh = 600, ar = img.width/img.height, tar = bw/bh;
    let sw = img.width, sh = img.height, sx = 0, sy = 0;
    if (ar > tar){ sw = img.height*tar; sx = (img.width-sw)/2; } else { sh = img.width/tar; sy = (img.height-sh)*.3; }
    g.save(); g.beginPath(); g.roundRect(24,24,bw,bh,18); g.clip(); g.drawImage(img, sx, sy, sw, sh, 24, 24, bw, bh); g.restore();
    g.fillStyle = "#1f1c18"; g.font = "400 40px Georgia, serif"; g.fillText(title, 32, 682);
    g.fillStyle = "#6b645b"; g.font = "400 24px Inter, sans-serif"; g.fillText(sub, 32, 726);
    tex.needsUpdate = true; };
  img.src = src;
  addMemory(key, tex, pos, rot, size);
}

function moveInd(){ const b = yearsEl.querySelector("button.on");
  yearsEl.style.setProperty("--o", b ? 1 : 0);
  if (b){ yearsEl.style.setProperty("--x", b.offsetLeft + "px"); yearsEl.style.setProperty("--w", b.offsetWidth + "px"); } }
addEventListener("resize", moveInd);
$("#home").onclick = () => setStop(0);
window.__go = (i) => { setStop(i, true); for (const arr of Object.values(memories)) arr.forEach(o => { o.m.material.opacity = o.on ? 1 : 0; }); };
$("#go").onclick = e => { e.preventDefault(); setStop(stop === STOPS.length-1 ? 0 : stop+1); };

/* scroll / swipe / keys */
let wheelLock = 0;
addEventListener("wheel", e => { if (macOpen || !entered) return; const now = performance.now(); if (now < wheelLock || Math.abs(e.deltaY) < 12) return; wheelLock = now + 750; setStop(stop + (e.deltaY > 0 ? 1 : -1)); }, { passive:true });
let ty = null, tx = null, moved = false;
canvas.addEventListener("pointerdown", e => { ty = e.clientY; tx = e.clientX; moved = false; });
addEventListener("pointerup", e => { if (ty === null) return; const dy = e.clientY - ty, dx = e.clientX - tx; if (Math.abs(dy) > 50 || Math.abs(dx) > 70){ moved = true; setStop(stop + ((Math.abs(dy) > Math.abs(dx) ? -dy : -dx) > 0 ? 1 : -1)); } ty = null; });
addEventListener("keydown", e => {
  if (macOpen){ if (e.key === "Escape") closeLaptop(); return; }
  if (!entered) return;
  if (["ArrowDown","ArrowRight","PageDown"].includes(e.key)) setStop(stop+1);
  if (["ArrowUp","ArrowLeft","PageUp"].includes(e.key)) setStop(stop-1);
});
addEventListener("pointermove", e => { mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); hover(e); });

/* picking: laptop + product cards */
const ray = new THREE.Raycaster();
function pickables(){ const list = [laptop]; for (const arr of Object.values(memories)) arr.forEach(o => { if (o.on && o.m.userData.link) list.push(o.m); }); return list; }
function hit(e){ const p = new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(p, camera); const h = ray.intersectObjects(pickables(), true)[0]; if (!h) return null; let o = h.object; while (o && !o.userData.tip) o = o.parent; return o; }
function hover(e){ if (macOpen || !entered) return; const o = hit(e); canvas.style.cursor = o ? "pointer" : "default"; const tip = $("#tip"); if (o){ tip.textContent = o.userData.tip; tip.style.left = e.clientX+"px"; tip.style.top = e.clientY+"px"; tip.classList.add("on"); } else tip.classList.remove("on"); }
canvas.addEventListener("click", e => { if (moved || macOpen) return; const o = hit(e); if (!o) return; if (o === laptop) openLaptop(); else if (o.userData.link) window.open(o.userData.link, "_blank", "noopener"); });

/* ---------- laptop: fly in, then open the real desktop ---------- */
let macOpen = false, flying = false;
function openLaptop(){
  if (macOpen || flying) return; flying = true; $("#tip").classList.remove("on");
  document.body.classList.add("hide-ui"); if (person) person.visible = false;
  goalPos.set(...POSES.laptop.p); goalTgt.set(...POSES.laptop.t);
  const fr = $("#macframe"); if (!fr.src) fr.src = "mac/";
  setTimeout(() => { $("#mac").classList.add("open"); $("#mac").setAttribute("aria-hidden","false"); macOpen = true; flying = false; $("#back").focus(); }, reduce ? 0 : 1300);
}
function closeLaptop(){ $("#mac").classList.remove("open"); $("#mac").setAttribute("aria-hidden","true"); macOpen = false; document.body.classList.remove("hide-ui"); if (person) person.visible = true; setStop(stop); }
$("#back").onclick = closeLaptop;
addEventListener("message", e => { if (e.data === "close-laptop" && macOpen) closeLaptop(); });

/* eye: hide ui to just look at the room */
$("#eye").onclick = () => { document.body.classList.toggle("hide-ui"); $("#eye").setAttribute("aria-label", document.body.classList.contains("hide-ui") ? "Show the interface" : "Hide the interface"); };

/* intro */
let entered = false;
$("#enter").onclick = () => { entered = true; $("#intro").classList.add("gone"); setStop(0);
  document.body.classList.add("entering"); document.body.classList.remove("pre");
  setTimeout(() => document.body.classList.remove("entering"), 1400); };

/* ---------- loop ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
ao.updateGtaoMaterial({ radius:.35, distanceExponent:1.4, thickness:1, scale:1.1, samples:12 });
ao.blendIntensity = .85;
composer.addPass(ao);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .7, .25, 2.2));
composer.addPass(new OutputPass());
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w/h; camera.fov = w < 720 ? 62 : 42; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  const k = reduce ? 1 : .045;
  camPos.lerp(goalPos, k); camTgt.lerp(goalTgt, k);
  look.lerp(mouse, .05);
  camera.position.copy(camPos);
  if (!macOpen && !flying) { camera.position.x += look.x * .08; camera.position.y += look.y * .04; }
  camera.lookAt(camTgt);
  for (const arr of Object.values(memories)) arr.forEach((o,i) => {
    const mat = o.m.material, target = o.on ? 1 : 0;
    mat.opacity += (target - mat.opacity) * .08; o.m.visible = mat.opacity > .01;
    const s = .85 + mat.opacity*.15; o.m.scale.setScalar(s);
    o.m.position.y = o.base.y + (reduce ? 0 : Math.sin(t*.9 + i) * .012);
  });
  if (window.__appleGlow) window.__appleGlow.material.opacity = .32 + Math.sin(t*1.6)*.12;
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
