<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>Utsav's MacBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/motion.css?v=10">
<style>
:root{
  --ink:#1d1d1f; --ink-2:#55555c; --ink-3:#8a8a92; --line:rgba(0,0,0,.08);
  --win:#ffffff; --win-2:#f6f6f8; --blue:#0a7aff; --green:#1f9d55; --red:#e5484d;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --glass:blur(30px) saturate(1.8);
  --shadow:0 0 0 .5px rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.28),0 4px 14px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(10,122,255,.55);outline-offset:1px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* wallpaper */
.wall{position:fixed;inset:0;background:#c98a5a url("assets/wallpaper.jpg") center/cover no-repeat}
.wall svg{display:none}

/* menu bar */
.mb{position:fixed;inset:0 0 auto;height:30px;z-index:900;display:flex;align-items:center;gap:2px;padding:0 10px;color:#fff;font-size:13.5px;text-shadow:0 1px 2px rgba(0,0,0,.25);background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,0))}
.mb button{border:0;background:none;color:inherit;padding:3px 9px;border-radius:6px;cursor:default}
.mb button:hover,.mb button.on{background:rgba(255,255,255,.2)}
.mb .app{font-weight:700}
.mb .sp{flex:1}
.mb .deskbtn{margin-left:10px;padding:2px 11px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);font-weight:600;cursor:pointer}
.mb .deskbtn:hover{background:rgba(255,255,255,.34)}
.mb .st{display:flex;align-items:center;gap:12px;padding-right:6px}
.mb svg{display:block}
.menu{position:fixed;top:30px;left:8px;z-index:950;min-width:230px;padding:5px;border-radius:12px;background:rgba(246,246,248,.82);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow);display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13.5px}
.menu button:hover{background:var(--blue);color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* dock: liquid glass */
.dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:800;display:flex;align-items:flex-end;gap:6px;padding:7px 8px;border-radius:24px;background:rgba(255,255,255,.16);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 40px rgba(0,0,0,.25)}
.dock button{position:relative;border:0;background:none;padding:0;cursor:pointer;transition:transform .18s cubic-bezier(.3,.7,.3,1.4)}
.dock button:hover{transform:translateY(-10px) scale(1.18)}
.dock button::after{content:attr(data-name);position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);white-space:nowrap;font-size:12.5px;padding:4px 10px;border-radius:8px;background:rgba(240,240,244,.9);color:#111;box-shadow:0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .12s}
.dock button:hover::after{opacity:1}
.dock button.open::before{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.dock .sep{width:1px;align-self:stretch;margin:6px 3px;background:rgba(255,255,255,.35)}

/* icons: squircles */
.ic{width:54px;height:54px;border-radius:12.5px;display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.15)}
.ic svg{width:62%;height:62%}
.ic img{width:100%;height:100%;object-fit:cover}
.i-finder{background:linear-gradient(90deg,#1e8cff 50%,#e8f2ff 50%)}
.i-notes{background:linear-gradient(#ffd60a 0 24%,#fffdf4 24%)}
.i-photos{background:#fff}
.i-safari{background:linear-gradient(#f4f4f6,#d9d9de)}
.i-msg{background:linear-gradient(#5ff777,#13c33a)}
.i-mail{background:linear-gradient(#48b6ff,#0a6cff)}
.i-fs{background:#fff}
.i-p2p{background:linear-gradient(135deg,#7c6cf2,#a99cff)}
.i-flow{background:linear-gradient(135deg,#18181b,#3f3f46)}
.i-gate{background:linear-gradient(135deg,#0f3d33,#1d6b58)}
.i-pay{background:linear-gradient(135deg,#ffd43b,#ffaa00);color:#3b2a00;font:800 26px var(--sans)}
.i-camp{background:linear-gradient(135deg,#ff5f6d,#ff8e53)}
.i-trash{background:transparent;box-shadow:none}
.ic.real{background:none;box-shadow:none;overflow:visible;border-radius:0}
.ic.real img{width:122%;height:122%;max-width:none;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}

/* windows */
.win{position:absolute;z-index:10;display:flex;flex-direction:column;background:var(--win);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:320px;opacity:0;transform:scale(.97);transition:opacity .16s,transform .2s cubic-bezier(.2,.8,.2,1)}
.win.show{opacity:1;transform:none}
.win:not(.front){box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 10px 30px rgba(0,0,0,.18)}
.tb{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--win-2);border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:8px}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.lights .c{background:#ff5f57}.lights .m{background:#febc2e}.lights .z{background:#28c840}
.win:not(.front) .lights button{background:#d6d6da}
.lights svg{width:7px;height:7px;opacity:0}
.tb:hover .lights svg{opacity:.55}
.tb .t{flex:1;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-right:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{flex:1;overflow:auto;position:relative;user-select:text}
.pad{padding:20px 22px}

/* notification */
.notif{position:fixed;top:40px;right:12px;z-index:960;width:340px;display:flex;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(246,246,248,.78);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow);transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.notif.show{transform:none}
.notif .ic{width:38px;height:38px;border-radius:9px;flex:none}
.notif b{display:block;font-size:13.5px}
.notif span{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;top:44px;transform:translateX(-50%) translateY(-16px);z-index:970;background:rgba(30,30,35,.9);color:#fff;padding:9px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* desktop widget */
.widget{position:fixed;right:18px;top:48px;z-index:2;width:170px;padding:14px 16px;border-radius:22px;color:#fff;background:rgba(255,255,255,.14);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.22)}
.widget b{display:block;font:300 40px/1 var(--sans);letter-spacing:-.02em}
.widget span{font-size:12px;opacity:.85}

/* Notes */
.notes{display:grid;grid-template-columns:170px 230px 1fr;height:100%}
.n-side{background:#f4f4f6;border-right:1px solid var(--line);padding:12px 8px;font-size:13px}
.n-side h5{margin:6px 8px;font-size:11px;color:var(--ink-3);font-weight:600}
.n-side div{padding:6px 10px;border-radius:7px;display:flex;justify-content:space-between}
.n-side div.on{background:rgba(0,0,0,.07);font-weight:600}
.n-list{border-right:1px solid var(--line);overflow:auto;padding:8px}
.n-list h5{margin:10px 8px 4px;font-size:12px;color:var(--ink-3)}
.n-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer}
.n-list button b{display:block;font-size:13.5px}
.n-list button span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-list button.on{background:#ffd60a}
.n-list button.on span{color:#5c4a00}
.n-body{overflow:auto;padding:22px 34px 40px;user-select:text}
.n-body .date{text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:12px}
.n-body h1{font:700 24px var(--sans);margin:0 0 12px}
.n-body p,.n-body li{font-size:15px;line-height:1.6}
.n-body ul{padding-left:20px}
.n-body img{width:min(320px,100%);border-radius:10px;display:block;margin:4px 0 14px}
.n-body a,.n-body .lk{color:#b8860b;font-weight:600;text-decoration:none;cursor:pointer;border:0;background:none;padding:0}
.n-body .tl b{display:inline-block;min-width:62px;color:var(--ink-3);font-weight:600}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;padding:4px}
.photos button{border:0;padding:0;cursor:zoom-in;aspect-ratio:1;overflow:hidden;border-radius:4px}
.photos img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.photos button:hover img{transform:scale(1.04)}
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:92%;max-height:82%;border-radius:8px}

/* Safari */
.saf{display:flex;flex-direction:column;height:100%}
.saf-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--win-2)}
.saf-bar input{flex:1;max-width:520px;margin:0 auto;text-align:center;border:0;border-radius:9px;padding:7px 12px;background:rgba(0,0,0,.06);font-size:13px}
.saf-bar button{border:0;background:none;font-size:18px;color:var(--ink-3);cursor:pointer;padding:2px 8px;border-radius:6px}
.saf-page{flex:1;overflow:auto}
.fav{padding:40px 36px}
.fav h2{font:700 20px var(--sans);margin:0 0 18px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:22px}
.fav-grid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:12.5px}
.fav-grid .ic{width:72px;height:72px;border-radius:16px}
.site{padding:40px 44px;max-width:780px}
.site .kick{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.site h1{font:400 44px/1.05 var(--serif);margin:8px 0 12px}
.site p{font-size:16px;color:var(--ink-2)}
.site .shot{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:18px}

/* Mail */
.mail{padding:0}
.mail .mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--win-2)}
.mail .mhead img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.15)}
.mail .mhead b{display:block;font-size:14.5px}.mail .mhead span{font-size:12.5px;color:var(--ink-3)}
.mail .f{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.mail .f span{color:var(--ink-3);width:56px}
.mail .f input{flex:1;border:0;outline:none;background:none}
.mail textarea{width:100%;min-height:200px;border:0;outline:none;padding:16px 18px;resize:vertical;font-size:14.5px;line-height:1.55}
.mail .mbar{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* Finder */
.finder{display:grid;grid-template-columns:170px 1fr;height:100%}
.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:18px;align-content:start}
.f-grid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;cursor:pointer;font-size:12.5px;text-align:center}
.f-grid button:hover{background:rgba(10,122,255,.1)}

/* about this mac */
.atm{padding:26px 28px;text-align:center}
.atm .big{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block}
.atm h2{font:600 24px var(--sans);margin:0}
.atm table{margin:16px auto 0;font-size:13px;text-align:left;border-spacing:10px 4px}
.atm td:first-child{color:var(--ink-3);text-align:right}

/* common bits */
.h{font:400 30px/1.08 var(--serif);margin:0 0 6px;letter-spacing:-.005em}
.h i{color:#ff6a3d}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f1f1f4;color:var(--ink-2)}
.chip.live{background:#e5f7ec;color:#137a3f}
.chip.concept{background:#fff1e6;color:#b4540a}
.chip.plan{background:#eef2ff;color:#3346c8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;transition:transform .1s,background .15s}
.btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#f1f1f4;color:var(--ink)}
.btn.ghost:hover{background:#e7e7ec}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{border:1px solid var(--line);border-radius:12px;padding:14px}
.seg{display:inline-flex;background:#f1f1f4;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:12px}

/* ---------- About ---------- */
.about-top{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.about-top .ava{width:72px;height:72px;font-size:30px}
.years{display:flex;gap:4px;margin:14px 0 10px;overflow-x:auto;padding-bottom:4px}
.years button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.years button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.yr-card{min-height:150px;border-radius:14px;padding:18px;background:linear-gradient(135deg,#fff7f0,#fff);border:1px solid #ffe2cf}
.yr-card h3{font:400 24px/1.1 var(--serif);margin:0 0 8px}
.quote{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;background:#f7f7f9}
.quote q{flex:1;font:400 19px/1.3 var(--serif)}

/* ---------- Campaign ---------- */
.camp textarea,.camp input{width:100%;font:15px var(--sans);padding:10px 12px;border-radius:10px;border:1px solid #ddd;background:#fff;color:var(--ink)}
.camp{padding:20px 22px}
.camp textarea{min-height:76px;resize:vertical}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmp div{border-radius:12px;padding:12px;background:#f7f7f9}
.cmp b{font-size:26px;display:block}
.post{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#fff}
.post .who{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:6px}
.post .who .ava{width:34px;height:34px;font-size:15px}
.post p{white-space:pre-wrap;margin:0 0 10px;font-size:14px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.board div{border-radius:12px;padding:12px;font-size:13px;background:#fff4f2}
.board b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#c2410c;margin-bottom:4px}

/* ---------- Messages ---------- */
.chat{display:flex;flex-direction:column;height:100%}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-h .ava{width:36px;height:36px;font-size:16px}
.chat-h small{display:block;color:var(--green);font-size:12px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub-m{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;animation:pop .2s}
.bub-m.them{align-self:flex-start;background:#e9e9eb;border-bottom-left-radius:6px}
.bub-m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub-m a{color:inherit;font-weight:600}
.typing{align-self:flex-start;background:#e9e9eb;border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#999;animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.25;transform:translateY(-2px)}}
.replies{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#fafafa}
.replies button{border:1px solid #cfe0ff;background:#fff;color:var(--blue);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.replies button:hover{background:#eef4ff}



/* Music */
.i-music{background:linear-gradient(160deg,#ff5c7a,#fa2d48)}
.i-build{background:radial-gradient(circle at 30% 25%,#7c5cff,#1b1035 75%)}
.music{display:grid;grid-template-columns:290px 1fr;height:100%}
.m-list{background:#f6f6f8;border-right:1px solid var(--line);overflow:auto;padding:10px}
.m-list h5{margin:6px 8px 10px;font-size:12px;color:var(--ink-3)}
.m-list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px;border-radius:10px;cursor:pointer}
.m-list button:hover{background:rgba(0,0,0,.05)}
.m-list button.on{background:rgba(250,45,72,.12)}
.m-list img{width:64px;height:40px;object-fit:cover;border-radius:6px;flex:none}
.m-list b{display:block;font-size:13px;line-height:1.25}
.m-list span{font-size:11.5px;color:var(--ink-3)}
.m-main{display:flex;flex-direction:column;padding:18px;gap:12px;overflow:auto;background:#fff}
.m-main .vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.m-main iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.m-main .np{font-size:12px;color:#fa2d48;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.m-main h2{margin:2px 0 0;font:700 20px var(--sans)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}
.eq i{width:3px;background:#fa2d48;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* Build with voice */
.bld{min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#2a1b5e 0%,#120c26 60%,#0b0818 100%);color:#efeaff;padding:22px 26px 30px}
.bld .tabs{display:inline-flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin-bottom:18px}
.bld .tabs button{border:0;background:none;color:#cfc6ff;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.bld .tabs button.on{background:#fff;color:#1b1035}
.bld h1{font:400 38px/1.05 var(--serif);margin:0 0 6px}
.bld h1 i{color:#b9a6ff}
.bld .sub{color:#b8b0d9;margin:0 0 18px;font-size:14.5px;max-width:62ch}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 20px}
.stage{position:relative;border-radius:14px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:background .4s,border-color .4s,transform .4s}
.stage .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--sans);background:rgba(255,255,255,.14)}
.stage b{display:block;font-size:13px;margin-top:4px}
.stage span{font-size:11.5px;color:#a79fcb}
.stage.on{background:rgba(124,92,255,.28);border-color:#9d86ff;transform:translateY(-2px)}
.stage.done{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.5)}
.stage:not(:last-child)::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:#6f63a6;font-size:12px}
.micwrap{display:flex;gap:16px;align-items:center;margin:6px 0 14px;flex-wrap:wrap}
.voice{width:84px;height:84px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#1b1035;background:radial-gradient(circle at 35% 30%,#fff,#d8ccff);box-shadow:0 0 0 8px rgba(157,134,255,.18),0 10px 30px rgba(124,92,255,.45)}
.voice svg{width:34px;height:34px}
.voice.on{animation:vring 1.2s infinite;background:radial-gradient(circle at 35% 30%,#fff,#ffb3c0)}
@keyframes vring{0%{box-shadow:0 0 0 0 rgba(255,120,150,.55),0 10px 30px rgba(124,92,255,.45)}100%{box-shadow:0 0 0 26px rgba(255,120,150,0),0 10px 30px rgba(124,92,255,.45)}}
.wave{display:flex;gap:3px;align-items:center;height:40px}
.wave i{width:4px;border-radius:3px;background:#b9a6ff;height:6px;transition:height .12s}
.bld textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;padding:12px 14px;font-size:14.5px;resize:vertical}
.bld textarea::placeholder{color:#8e86b3}
.out{display:grid;gap:10px;margin-top:16px}
.out .box{border-radius:14px;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);animation:pop .35s}
.out .box h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#b9a6ff}
.out .box p,.out .box li{margin:0;font-size:14px;color:#e8e3ff;line-height:1.55}
.out pre{white-space:pre-wrap;margin:0;font:13px/1.55 ui-monospace,Menlo,monospace;color:#f3efff}
.bld .btn{background:#fff;color:#1b1035}
.bld .btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.story{display:grid;gap:12px}
.step{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.step .k{font-size:11.5px;color:#a79fcb;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.step .said{font:400 17px/1.4 var(--serif);color:#fff}
.step .said::before{content:"“";font-size:15px;opacity:.6}
.step .did{font-size:13.5px;color:#b8b0d9;margin-top:6px}
.step .did::before{content:"→ Claude: ";color:#9d86ff;font-weight:600}
.legend{font-size:12px;color:#8e86b3;margin-top:14px}

/* Made with Flow: the animated story */
.mwf{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#241a3d 0%,#110d1c 55%,#08070d 100%);color:#f4f1ff;font-family:var(--sans)}
.mwf .cap{position:absolute;left:0;right:0;top:22px;text-align:center;z-index:5;pointer-events:none}
.mwf .cap small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a99ad8}
.mwf .cap h2{margin:6px 0 0;font:400 34px/1.1 var(--serif)}
.mwf .cap h2 i{color:#c9b8ff}
.mwf .ctrl{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px;z-index:6}
.mwf .ctrl button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.mwf .dots{display:flex;gap:6px}
.mwf .dots b{width:28px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer}
.mwf .dots b i{display:block;height:100%;width:0;background:#c9b8ff}
.mwf .dots b.done i{width:100%}
/* scene 1: head + ideas */
.mwf .me{position:absolute;left:50%;top:52%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px rgba(201,184,255,.15),0 0 60px rgba(124,92,255,.5);transition:all .9s cubic-bezier(.2,.8,.2,1)}
.mwf .idea{position:absolute;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);white-space:nowrap;transition:left 1.1s cubic-bezier(.6,0,.4,1),top 1.1s cubic-bezier(.6,0,.4,1),transform 1.1s,opacity .6s;opacity:0;transform:scale(.6)}
.mwf .idea.in{opacity:1;transform:scale(1);animation:bob 4s ease-in-out infinite}
.mwf .idea.gone{opacity:0;transform:scale(.2);animation:none}
@keyframes bob{50%{translate:0 -6px}}
/* scene 2: the Flow bar */
.mwf .pill{position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(30px);display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:999px;background:#0c0c10;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.6);opacity:0;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.mwf .pill.in{opacity:1;transform:translateX(-50%)}
.mwf .pill img{width:26px;height:26px;border-radius:7px}
.mwf .pill .bars{display:flex;gap:3px;align-items:center;height:22px}
.mwf .pill .bars i{width:3px;border-radius:3px;background:#fff;height:4px;transition:height .1s}
.mwf .pill span{font-size:12px;color:#bdb6d8}
/* scene 3: the Flow app window */
.mwf .app{position:absolute;left:50%;top:47%;width:min(680px,88%);height:300px;transform:translate(-50%,-46%) scale(.94);opacity:0;display:grid;grid-template-columns:170px 1fr;border-radius:14px;overflow:hidden;background:#fbfaf7;color:#1d1b22;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:all .7s cubic-bezier(.2,.8,.2,1)}
.mwf .app.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mwf .app aside{background:#f1efe9;padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.mwf .app aside .brand{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 8px 12px}
.mwf .app aside .brand img{width:22px;height:22px;border-radius:6px}
.mwf .app aside div{padding:6px 10px;border-radius:8px;color:#4a4655}
.mwf .app aside div.on{background:#fff;color:#111;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mwf .app aside .sp{flex:1;padding:0}
.mwf .app main{padding:16px 18px;overflow:hidden}
.mwf .app main h4{margin:0 0 10px;font-size:15px}
.mwf .feed{display:flex;flex-direction:column;gap:8px}
.mwf .feed .row2{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #ece9e2;animation:pop .35s}
.mwf .feed .row2 time{color:#9a95a6;font-size:11.5px;padding-top:1px}
/* scene 4: shapes */
.mwf .shapes{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,170px);gap:14px}
.mwf .shape{height:112px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden;opacity:0;transform:translateY(16px) scale(.9);transition:all .5s cubic-bezier(.2,.8,.2,1)}
.mwf .shape.in{opacity:1;transform:none}
.mwf .shape .art{position:absolute;inset:10px 10px 30px}
.mwf .shape b{position:absolute;left:10px;bottom:8px;font-size:12px;font-weight:600}
.mwf .shape em{position:absolute;right:8px;top:8px;font-style:normal;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;transform:rotate(6deg)}
.mwf .shape em.no{background:#ff4d5e;color:#fff}.mwf .shape em.ok{background:#34c759;color:#fff}
.mwf .shape.win{border-color:#c9b8ff;box-shadow:0 0 40px rgba(201,184,255,.35)}
/* scene 5 */
.mwf .final{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .8s}
.mwf .final.in{opacity:1}
.mwf .final .row{justify-content:center;margin-top:16px}
.mwf .final .btn{background:#fff;color:#1b1035}
.mwf .final .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.mwf .stats{display:flex;gap:26px;justify-content:center;margin-top:8px}
.mwf .stats div{font-size:12.5px;color:#bdb6d8}.mwf .stats b{display:block;font:400 36px var(--serif);color:#fff}

/* Apple Music style */
.am{display:grid;grid-template-columns:200px 1fr;grid-template-rows:1fr auto;height:100%}
.am-side{grid-row:1/3;background:#f4f4f6;border-right:1px solid var(--line);padding:12px 10px;font-size:13px;overflow:auto}
.am-side h5{margin:14px 8px 4px;font-size:11px;color:var(--ink-3)}
.am-side div{padding:6px 10px;border-radius:7px;color:#333}
.am-side div.on{background:rgba(250,45,72,.12);color:#fa2d48;font-weight:600}
.am-search{background:rgba(0,0,0,.06);color:var(--ink-3)!important}
.am-main{overflow:auto;padding:18px 24px}
.am-main h1{font:700 26px var(--sans);margin:0 0 14px}
.am-main h2{font:700 18px var(--sans);margin:20px 0 8px}
.am-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.am-tile{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.am-tile img{width:100%;aspect-ratio:1;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:block;transition:transform .2s}
.am-tile:hover img{transform:scale(1.02)}
.am-tile small{display:block;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.am-tile b{font-size:13.5px}
.am-row{display:grid;grid-template-columns:26px 40px 1fr 1fr 50px;gap:12px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;cursor:pointer;font-size:13px}
.am-row:nth-child(odd){background:rgba(0,0,0,.025)}
.am-row:hover{background:rgba(0,0,0,.06)}
.am-row.on{background:rgba(250,45,72,.1)}
.am-row.on .n{color:#fa2d48}
.am-row img{width:40px;height:40px;border-radius:5px}
.am-row .n,.am-row .d{color:var(--ink-3);font-variant-numeric:tabular-nums}
.am-row .tt b{display:block;font-weight:600}.am-row .tt span,.am-row .al{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:rgba(250,250,252,.92)}
.am-bar img{width:44px;height:44px;border-radius:6px;background:#eee}
.am-now{flex:1;min-width:0}.am-now b{display:block;font-size:13.5px}.am-now span{font-size:12px;color:var(--ink-3)}
.am-prog{height:3px;background:rgba(0,0,0,.1);border-radius:3px;margin-top:6px;overflow:hidden}.am-prog i{display:block;height:100%;width:0;background:#fa2d48}
.am-bar button{border:0;background:none;font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:50%}
.am-bar button:hover{background:rgba(0,0,0,.06)}
/* now playing widget */
.nowp{position:fixed;right:18px;top:48px;z-index:2;width:250px;display:flex;gap:12px;align-items:center;padding:12px;border-radius:22px;color:#fff;background:rgba(30,20,25,.32);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,.22)}

.nowp b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowp span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nowp button{border:0;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;cursor:pointer;flex:none}

.n-side .nf{align-items:center}
.n-side .nf span:first-child{display:flex;align-items:center;gap:8px}
.n-head{padding:6px 10px 10px}.n-head b{display:block;font-size:17px}.n-head span{font-size:12px;color:var(--ink-3)}

.n-tool button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
.n-search{flex:1;border-radius:999px;padding:8px 14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06);color:var(--ink-3);font-size:13.5px}
.n-body .date{text-align:left!important;font-size:13px!important;margin:6px 0 10px!important}
.n-body h1{font-size:26px!important}

/* Wispr-style home */
.wf{display:grid;grid-template-columns:200px 1fr;height:100%;background:#fbfaf7}
.wf-side{background:#f1efe9;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.wf-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:4px 8px 14px}

.wf-stats span{font-size:12.5px;color:var(--ink-3)}
.wf-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px}
.wf-card{background:#fff;border:1px solid #ece9e2;border-radius:14px;padding:14px 16px}

.wf-chart{display:flex;align-items:flex-end;gap:8px;height:130px}

@media (max-width:760px){
  .wf{grid-template-columns:1fr}.wf-side{display:none}.wf-stats,.wf-grid{grid-template-columns:1fr 1fr}
  .am{grid-template-columns:1fr}.am-side{display:none}.am-row{grid-template-columns:22px 40px 1fr 44px}.am-row .al{display:none}
  .nowp{display:none}
  .mwf .shapes{grid-template-columns:repeat(2,140px)}
  .mwf .app{grid-template-columns:1fr}.mwf .app aside{display:none}
  .mwf .cap h2{font-size:26px}
  .music{grid-template-columns:1fr}.m-list{display:none}
  .pipe{grid-template-columns:1fr 1fr}
  .step{grid-template-columns:1fr}
  .mb .hide-sm{display:none}
  .widget{display:none}
  .dock{left:6px;right:6px;transform:none;overflow-x:auto;justify-content:flex-start;border-radius:20px}
  .dock .ic{width:46px;height:46px}
  .dock button:hover{transform:none}
  .win{position:fixed!important;left:0!important;top:30px!important;width:100%!important;height:calc(100% - 100px)!important;border-radius:14px 14px 0 0;min-width:0}
  .notes{grid-template-columns:1fr}
  .n-side,.n-list{display:none}
  .notes.list .n-list{display:block}
  .notes.list .n-body{display:none}
  .finder{grid-template-columns:1fr}.finder .n-side{display:none}
  .notif{width:auto;left:10px}
}

/* ================= motion layer (Framer-style) ================= */
/* boot: wallpaper settles, chrome slides into place */
.wall{animation:wall-in 1.4s var(--ease-out) both}
@keyframes wall-in{from{scale:1.08;filter:blur(16px) brightness(.7)}}
.mb{animation:slide-down .8s .15s var(--spring) both}
@keyframes slide-down{from{translate:0 -100%;opacity:0}}
.dock{animation:dock-up .9s .25s var(--spring) both}
@keyframes dock-up{from{translate:-50% 140%;opacity:0}to{translate:-50% 0}}
.dock{transform:none;translate:-50% 0}
.nowp{animation:pop-in .9s .5s var(--spring) both;transform-origin:top right}

/* dock: real macOS magnification, neighbours grow too (:has looks backwards) */
.dock{--ic:54px}
.dock .ic{width:var(--ic);height:var(--ic);scale:var(--s,1);transform-origin:50% 100%;margin-inline:calc(var(--ic) * (var(--s,1) - 1) / 2);transition:scale .45s var(--spring-snap),margin-inline .45s var(--spring-snap)}
.dock button::after{bottom:calc(100% + 12px + var(--ic) * (var(--s,1) - 1))}
.dock button{transform:none!important;transition:translate .45s var(--spring-snap)}
@media (hover:hover){
  .dock button:hover{--s:1.5}
  .dock button:hover + button,.dock button:has(+ button:hover){--s:1.26}
  .dock button:hover + button + button,.dock button:has(+ button + button:hover){--s:1.1}
}
.dock button:active .ic{scale:.9;transition:scale .3s var(--spring-snap)}
.dock button.bounce{animation:dock-bounce .9s var(--ease-out)}
@keyframes dock-bounce{0%,100%{translate:0 0}25%{translate:0 -22px}50%{translate:0 0}70%{translate:0 -9px}}
.dock button::after{translate:0 6px;transition:opacity .15s,translate .4s var(--spring-snap)}
.dock button:hover::after{translate:0 0}
.dock button.open::before{animation:pop-in .5s var(--spring) both}

/* windows: spring up from the dock, blur in; close and minimise fall back down */
.win{transform:none;transform-origin:50% 100%;scale:.9;translate:0 24px;filter:blur(8px);transition:opacity .22s var(--ease-out),scale .7s var(--spring),translate .7s var(--spring),filter .35s var(--ease-out),box-shadow .3s}
.win.show{scale:1;translate:0 0;filter:none}
.win.min{opacity:0;scale:.2;translate:0 70vh;filter:blur(4px);transition:opacity .35s var(--ease-in),scale .38s var(--ease-in),translate .38s var(--ease-in),filter .3s}
.win.zooming{transition:left .6s var(--spring),top .6s var(--spring),width .6s var(--spring),height .6s var(--spring),box-shadow .3s}
.tb:active{cursor:grabbing}
.win.dragging{scale:1.01;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 34px 80px rgba(0,0,0,.34);transition:scale .4s var(--spring-snap),box-shadow .3s}
.lights button{transition:scale .4s var(--spring-snap),filter .2s}
.lights button:hover{filter:brightness(.92)}
.lights button:active{scale:.85}

/* menus: drop down like a popover */
.menu{display:block;opacity:0;visibility:hidden;scale:.96;translate:0 -6px;transform-origin:top left;pointer-events:none;transition:opacity .18s var(--ease-out),scale .45s var(--spring-snap),translate .45s var(--spring-snap),visibility .2s}
.menu.open{opacity:1;visibility:visible;scale:1;translate:0 0;pointer-events:auto}

/* notification and toast: spring in */
.notif{transition:transform .8s var(--spring)}
.toast{transition:opacity .25s var(--ease-out),transform .6s var(--spring)}

/* photos lightbox: fades in from display:none (@starting-style) */
.lightbox{transition:opacity .3s var(--ease-out),display .3s allow-discrete;opacity:0}
.lightbox.open{opacity:1}
@starting-style{.lightbox.open{opacity:0}}
.lightbox img{transition:scale .6s var(--spring)}
@starting-style{.lightbox.open img{scale:.9}}
.photos img{transition:scale .6s var(--spring-snap)}
.photos button:hover img{transform:none;scale:1.05}

/* buttons everywhere: tactile press */
.btn,.seg button,.chip,.fav-grid button,.f-grid button,.pill{transition:scale .45s var(--spring-snap),background-color .2s,color .2s,box-shadow .25s}
.btn:active,.seg button:active,.fav-grid button:active,.f-grid button:active{scale:.95}
.btn:hover{box-shadow:0 6px 18px rgba(0,0,0,.14)}
.seg button.on{transition:background-color .3s,box-shadow .3s,scale .45s var(--spring-snap)}

/* app content blurs in once the window lands */
.win.fresh.show .wb > *{animation:blur-in .6s .08s var(--ease-out) both}

@media (max-width:720px){
  /* narrow screens: icons shrink so the whole dock fits with no scrollbar,
     which leaves room above it for the magnified icon */
  .dock{--ic:min(46px, calc((100vw - 150px) / 16));left:50%;right:auto;translate:-50% 0;overflow:visible;justify-content:center;gap:4px;padding:6px 7px;border-radius:20px}
}
@media (max-width:520px){
  /* phones: a scrolling dock, and no hover magnification (touch has no hover) */
  .dock{--ic:46px;left:6px;right:6px;translate:0 0;overflow-x:auto;justify-content:flex-start;animation-name:dock-up-sm}
  @keyframes dock-up-sm{from{translate:0 140%;opacity:0}}
  .dock .ic{scale:1!important;margin-inline:0!important}
  .win{transform-origin:50% 100%}
}
@media (prefers-reduced-motion:reduce){
  .win,.win.show{scale:1;translate:0 0;filter:none}
}

/* ---------- guided tour pill (lives in the menu bar so it never covers a window) ---------- */
.tour{margin-left:8px;height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-radius:999px;background:rgba(20,18,30,.72);border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.25);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);white-space:nowrap;text-shadow:none;animation:pop-in .6s var(--spring) both}
.tour[hidden]{display:none}
.tour-k{font-size:11.5px;opacity:.75}.tour-k b{font-weight:700}
.tour-t{font-size:12.5px;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.tour-dots{display:flex;gap:4px}.tour-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,scale .4s var(--spring-snap)}
.tour-dots i.on{background:#fff;scale:1.25}
.mb .tour button{padding:1px 8px;border-radius:999px;cursor:pointer;font-size:12.5px}
.mb .tour .tour-next{background:#fff;color:#14121e;font-weight:700;padding:1px 11px;animation:tour-nudge 2.4s 2s ease-in-out infinite}
.mb .tour .tour-next:hover{background:#f1efff}
@keyframes tour-nudge{0%,80%,100%{scale:1}88%{scale:1.08}}
@media (max-width:900px){.tour-t,.tour-dots{display:none}}
@media (max-width:1100px){.mb:has(.tour:not([hidden])) > button:not(.deskbtn):not(.app):not(#appleBtn){display:none}}
@media (max-width:520px){.tour-k{display:none}.mb .deskbtn{display:none}}

/* tour pill extras */
.tour{position:relative;overflow:hidden}
.tour-prog{position:absolute;left:10px;right:10px;bottom:1px;height:2px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.tour-prog i{display:block;height:100%;width:0;background:#fff}
@keyframes tourp{from{width:0}to{width:100%}}

/* ---------- My AI toolkit ---------- */
.i-ai{background:linear-gradient(135deg,#6d5dfc,#d16bff 55%,#ff8a5c)}
.i-ideas{background:linear-gradient(135deg,#ffe27a,#ffb627)}
.aik,.ideas{padding:22px 26px 28px}
.aik h5{margin:16px 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.aik-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.aik-tool{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:translate .45s var(--spring-snap),box-shadow .3s}
.aik-tool:hover{translate:0 -2px;box-shadow:0 8px 22px rgba(0,0,0,.08)}
.aik-tool img{width:42px;height:42px;border-radius:11px;object-fit:contain;flex:none;background:#f5f5f7;padding:2px}
.aik-tool b{display:block;font-size:14px}.aik-tool span{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.aik-make{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.aik-make button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#faf9ff);cursor:pointer;transition:scale .45s var(--spring-snap),box-shadow .3s}
.aik-make button:hover:not([disabled]){box-shadow:0 8px 22px rgba(109,93,252,.14)}
.aik-make button:active:not([disabled]){scale:.96}
.aik-make button[disabled]{cursor:default}
.aik-make span{font-size:22px}.aik-make b{font-size:13.5px}.aik-make small{font-size:12px;color:var(--ink-2)}

/* ---------- Ideas for Flow ---------- */
.idea-list{display:grid;gap:10px}
.idea{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff}
.idea-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#1d1828;color:#fff}
.idea small{font-size:11.5px;font-weight:600;color:#b4540a;letter-spacing:.02em}
.idea h3{margin:2px 0 4px;font:400 21px/1.15 var(--serif)}
.idea p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.idea-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.idea-meta div{font-size:12.5px;color:var(--ink-2);padding:9px 11px;border-radius:10px;background:#f7f6f2}
.idea-meta b{display:block;font-size:11.5px;color:var(--ink);margin-bottom:2px}
@media (max-width:720px){.idea-meta{grid-template-columns:1fr}}

/* ---------- my products ---------- */
.prod{padding:22px 26px 28px}
.prod-top{display:flex;align-items:center;gap:14px}
.prod-top .ic,.prod-logo{width:52px;height:52px;border-radius:12px;object-fit:contain;flex:none}
.prod-top small{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pc)}
.prod-top h2{margin:0;font:400 32px/1.05 var(--serif)}
.prod-lede{font-size:16px;color:var(--ink-2);margin:10px 0 14px}
.prod-shot{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f5f5f7;box-shadow:0 12px 30px rgba(0,0,0,.08)}
.prod-shot img{display:block;width:100%;height:auto;animation:blur-in .5s var(--ease-out)}
.prod-shot figcaption{font-size:12.5px;color:var(--ink-3);padding:8px 12px;border-top:1px solid var(--line);background:#fff}
.prod-thumbs{display:flex;gap:8px;margin:10px 0 16px}
.prod-thumbs button{width:96px;height:58px;padding:0;border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.7;transition:opacity .2s,border-color .2s,scale .4s var(--spring-snap)}
.prod-thumbs button.on{border-color:var(--pc);opacity:1}.prod-thumbs button:active{scale:.95}
.prod-thumbs img{width:100%;height:100%;object-fit:cover;object-position:top}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod-grid div,.prod-change{font-size:13.5px;color:var(--ink-2);padding:12px 14px;border-radius:12px;background:#f7f6f2;line-height:1.5}
.prod-grid b,.prod-change b{display:block;color:var(--ink);font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.prod-change{margin-top:10px;background:#fff;border:1px dashed color-mix(in srgb,var(--pc) 45%,#fff)}
@media (max-width:720px){.prod-grid{grid-template-columns:1fr}}

/* ---------- how I use Wispr Flow ---------- */
.wf.use{display:block;height:auto;padding:24px 28px 28px;overflow:visible}
.wf-head{display:flex;align-items:center;gap:14px}
.wf-head img{width:48px;height:48px;border-radius:12px}
.wf-head small{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7c6cf2}
.wf-head h1{margin:0;font:400 32px/1.05 var(--serif)}
.wf.use .wf-sub{margin:10px 0 16px}
.wf-h{font-size:13.5px;margin:18px 0 10px}
.wf-uses{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.wf-uses div{background:#fff;border:1px solid #ece9e2;border-radius:14px;padding:12px 14px}
.wf-uses i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d1828;color:#fff;font:700 11.5px var(--sans);font-style:normal;margin-bottom:6px}
.wf-uses b{display:block;font-size:13.5px}.wf-uses span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
@media (max-width:720px){.wf.use .wf-stats{grid-template-columns:1fr 1fr}}

<script>
/* ============ helpers (shared with the app builders) ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const phone = () => innerWidth <= 760;
const toast = (msg, ms=2600) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), ms); };
const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ============ icons ============ */
const ICON = {
  finder:`<span class="ic real"><img src="assets/icons/Finder.png" alt=""></span>`,
  notes:`<span class="ic real"><img src="assets/icons/Notes.png" alt=""></span>`,
  photos:`<span class="ic real"><img src="assets/icons/Photos.png" alt=""></span>`,
  safari:`<span class="ic real"><img src="assets/icons/Safari.png" alt=""></span>`,
  msg:`<span class="ic real"><img src="assets/icons/Messages.png" alt=""></span>`,
  music:`<span class="ic real"><img src="assets/icons/Music.png" alt=""></span>`,
  made:`<span class="ic" style="background:#1d1828"><img src="assets/wispr-flow-icon.png" alt=""></span>`,
  build:`<span class="ic i-build"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><rect x="9.5" y="3" width="5" height="10" rx="2.5" fill="rgba(255,255,255,.25)"/><path d="M6.5 10.5a5.5 5.5 0 0 0 11 0M12 16v3"/><path d="M15.5 19.5l2.5-2.5 2.5 2.5M18 17v5" stroke="#b9a6ff"/></svg></span>`,
  mail:`<span class="ic real"><img src="assets/icons/Mail.png" alt=""></span>`,
  fs:`<span class="ic i-fs"><img src="assets/focusspace.png" alt=""></span>`,
  p2p:`<span class="ic" style="background:#fff"><img src="assets/play2place.png" alt="" style="width:86%;height:86%;object-fit:contain"></span>`,
  ai:`<span class="ic i-ai"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" opacity=".8"/></svg></span>`,
  ideas:`<span class="ic i-ideas"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="#fff8d6"/></svg></span>`,
  gate:`<span class="ic i-gate"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="20" rx="3" fill="#0b2a23"/><circle cx="12" cy="6.5" r="2" fill="#ff5f57"/><circle cx="12" cy="12" r="2" fill="#febc2e" opacity=".5"/><circle cx="12" cy="17.5" r="2" fill="#4ade80"/></svg></span>`,
  camp:`<span class="ic i-camp"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 10v4h4l8 5V5L7 10H3z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/></svg></span>`,
  trash:`<span class="ic real"><img src="assets/icons/Trash.png" alt=""></span>`,
  atm:`<span class="ic real"><img src="assets/icons/Settings.png" alt=""></span>`
};
const APPS = [
  { id:"finder", name:"Finder", w:760, h:480 },
  { id:"notes", name:"Notes", w:960, h:620 },
  { id:"photos", name:"Photos", w:820, h:560 },
  { id:"safari", name:"Safari", w:960, h:640 },
  { id:"msg", name:"Messages", w:440, h:600 },
  { id:"mail", name:"Mail", w:620, h:520 },
  { id:"music", name:"Music", w:900, h:560 },
  { sep:true },
  { id:"made", name:"How I use Wispr Flow", w:940, h:680 },
  { id:"story", name:"How I built this", w:900, h:620, hidden:true },
  { id:"build", name:"Build with voice", w:980, h:680 },
  { id:"ai", name:"My AI Toolkit", w:860, h:660 },
  { id:"fs", name:"FocusSpace", w:900, h:680 },
  { id:"p2p", name:"Play2Place", w:900, h:680 },
  { id:"gate", name:"Upgrade Gate", w:900, h:680 },
  { id:"ideas", name:"Ideas for Flow", w:820, h:660 },
  { id:"camp", name:"Say the Full Idea", w:640, h:660 },
  { sep:true },
  { id:"trash", name:"Trash", w:420, h:300 },
  { id:"atm", name:"About This Mac", w:420, h:470, hidden:true }
];
APPS.forEach(a => {
  if (a.sep) return $("#dock").appendChild(h(`<span class="sep" aria-hidden="true"></span>`));
  if (a.hidden) return;
  $("#dock").appendChild(h(`<button data-app="${a.id}" data-name="${a.name}" aria-label="Open ${a.name}">${ICON[a.id]}</button>`));
});
/* my live products open in a small window of their own; closing it brings you back here */
const LIVE = { fs:{ url:"https://focusspace.xyz", name:"FocusSpace" }, p2p:{ url:"https://play2place.online", name:"Play2Place" } };
function openLive(id){
  const L = LIVE[id], w = Math.min(1180, screen.availWidth - 120), hh = Math.min(780, screen.availHeight - 120);
  const x = Math.round((screen.availWidth - w)/2), y = Math.round((screen.availHeight - hh)/2);
  const pop = window.open(L.url, "live-" + id, `popup,width=${w},height=${hh},left=${x},top=${y}`);
  toast(pop ? `${L.name} is open in a small window. Close it to come back here.` : `Your browser blocked the window. Opening ${L.name} in a new tab.`);
  if (!pop) window.open(L.url, "_blank", "noopener");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-app]");
  if (b && b.closest(".dock") && LIVE[b.dataset.app]){ e.preventDefault(); openLive(b.dataset.app); return; }
  if (b){ e.preventDefault(); $("#appleMenu").classList.remove("open"); openApp(b.dataset.app); return; }
  if (!e.target.closest("#appleBtn")) $("#appleMenu").classList.remove("open");
});
$("#appleBtn").onclick = () => $("#appleMenu").classList.toggle("open");
$("#backDesk").onclick = () => { try { parent.postMessage("close-laptop", "*"); } catch(e){} };
$("#deskBtn").onclick = () => { try { parent.postMessage("close-laptop", "*"); } catch(e){} };
$("#helpBtn").onclick = () => toast("Tip: everything is in the Dock below. Start with Notes.");

/* ============ window manager ============ */
let z = 20, opened = {};
function openApp(id){
  if (opened[id]) { const w = opened[id]; if (w.style.display === "none"){ w.style.display = ""; requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("show"))); } focusWin(w); return w; }
  const app = APPS.find(a => a.id === id); if (!app) return;
  const n = Object.keys(opened).length;
  const W = Math.min(app.w, innerWidth - 40), H = Math.min(app.h, innerHeight - 130);
  const left = Math.max(16, Math.min(innerWidth - W - 16, (innerWidth - W)/2 + (n%5)*26 - 30));
  const top = Math.max(40, Math.min(innerHeight - H - 96, 52 + (n%5)*24));
  const win = h(`<section class="win" role="dialog" aria-label="${app.name}" style="left:${left}px;top:${top}px;width:${W}px;height:${H}px">
    <div class="tb"><div class="lights"><button class="c" aria-label="Close ${app.name}"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" stroke="#000" stroke-width="1.6"/></svg></button><button class="m" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="#000" stroke-width="1.6"/></svg></button><button class="z" aria-label="Zoom"><svg viewBox="0 0 10 10"><path d="M2 8V3l5 5H2zM8 2v5L3 2h5z" fill="#000"/></svg></button></div>
    <div class="t">${app.name}</div></div><div class="wb"></div></section>`);
  document.body.appendChild(win);
  opened[id] = win; win.dataset.id = id;
  BUILD[id]($(".wb", win), win);
  focusWin(win);
  win.classList.add("fresh"); setTimeout(() => win.classList.remove("fresh"), 900);
  requestAnimationFrame(() => requestAnimationFrame(() => win.classList.add("show")));
  $(".c", win).onclick = () => closeWin(id);
  $(".m", win).onclick = () => { win.classList.add("min"); setTimeout(() => { win.style.display = "none"; win.classList.remove("min", "show"); }, 380); };
  $(".z", win).onclick = () => { win.classList.add("zooming"); clearTimeout(win._zt); win._zt = setTimeout(() => win.classList.remove("zooming"), 650); if (win._full){ Object.assign(win.style, win._full); win._full = null; } else { win._full = { left:win.style.left, top:win.style.top, width:win.style.width, height:win.style.height }; Object.assign(win.style, { left:"8px", top:"36px", width:(innerWidth-16)+"px", height:(innerHeight-120)+"px" }); } };
  win.addEventListener("pointerdown", () => focusWin(win));
  drag(win);
  $$(`.dock [data-app="${id}"]`).forEach(b => { b.classList.add("open", "bounce"); setTimeout(() => b.classList.remove("bounce"), 900); });
  return win;
}
function focusWin(w){ $$(".win.front").forEach(x => x.classList.remove("front")); w.style.zIndex = ++z; w.classList.add("front"); $("#appName").textContent = APPS.find(a => a.id === w.dataset.id).name; }
function closeWin(id){
  const w = opened[id]; if (!w) return;
  w._cleanup && w._cleanup();
  w.classList.add("min"); setTimeout(() => w.remove(), 380);
  delete opened[id];
  $$(`.dock [data-app="${id}"]`).forEach(b => b.classList.remove("open"));
  const rest = $$(".win").filter(x => x !== w).sort((a,b) => b.style.zIndex - a.style.zIndex)[0];
  if (rest) focusWin(rest); else $("#appName").textContent = "Finder";
}
function drag(win){
  const tb = $(".tb", win); let sx, sy, ox, oy, on = false;
  tb.addEventListener("pointerdown", e => { if (phone() || e.target.closest("button")) return; on = true; sx = e.clientX; sy = e.clientY; ox = win.offsetLeft; oy = win.offsetTop; tb.setPointerCapture(e.pointerId); win.classList.add("dragging"); });
  tb.addEventListener("pointermove", e => { if (!on) return; win.style.left = Math.max(-win.offsetWidth+120, Math.min(innerWidth-120, ox+e.clientX-sx)) + "px"; win.style.top = Math.max(30, Math.min(innerHeight-60, oy+e.clientY-sy)) + "px"; });
  tb.addEventListener("pointerup", () => { on = false; win.classList.remove("dragging"); });
}
addEventListener("keydown", e => { if (e.key === "Escape"){ const f = $(".win.front"); if (f) closeWin(f.dataset.id); else parent.postMessage("close-laptop", "*"); } });

  // stages
  const stages = $$(".stage", el);
  const setStage = k => stages.forEach((s,i) => { s.classList.toggle("on", i===k); s.classList.toggle("done", i<k); });
  const clean = raw => { let s = " " + raw + " ";
    s = s.replace(/\b(um+|uh+|erm|like|you know|basically|so basically|matlab|okay so)\b,?/gi, " ");
    s = s.replace(/(\b[\w']+(?:\s+[\w']+){0,3})\s*,?\s*\b(no wait|sorry i mean|i mean|actually)\b\s*/i, " ");
    s = s.replace(/\s+/g," ").replace(/\s+,/g,",").trim(); s = s.charAt(0).toUpperCase() + s.slice(1); if (!/[.!?]$/.test(s)) s += "."; return s; };
  const words = s => (s.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!["that","this","with","they","their","what","when","which","would","could","there","about","want","make","just","have","from","into","help","helps","people","something","thing"].includes(w));

    ];
    let i = 0; const next = () => { setStage(i); steps[i](); i++; if (i < steps.length) setTimeout(next, 650); else setTimeout(()=>setStage(5), 650); };

    rec.start(); toast("Listening… speak your idea, then tap the mic again.");
  };
  win._cleanup = () => { rec && rec.stop(); clearInterval(wt); };

    <div class="wf-grid"><section class="wf-card"><h3>Words per day, last week</h3><div class="wf-chart">${FLOW.week.map(([d,w]) => `<div><i style="height:${Math.max(3, w/max*100)}%"></i><span>${d}</span></div>`).join("")}</div><p class="wf-note">1 Nov: ${fmt(6924)} words. That was the day I built this room by talking.</p></section>
      <section class="wf-card"><h3>Where the words went, last week</h3>${FLOW.apps.map(([a,w]) => `<div class="wf-bar"><span>${a}</span><div><i style="width:${w/appMax*100}%"></i></div><b>${fmt(w)}</b></div>`).join("")}<p class="wf-note">Mostly into Claude and Codex: I build by talking.</p></section></div>
    <div class="row" style="margin-top:16px"><button class="btn" data-open="story">Watch how I built this</button><button class="btn ghost" data-open="ideas">My ideas for Flow</button><a class="btn ghost" href="https://wisprflow.ai" target="_blank" rel="noopener">Try Wispr Flow ↗</a></div>
  </div>`;
  $$("[data-open]", el).forEach(b => b.onclick = () => openApp(b.dataset.open));
};

/* ---- Made with Flow: ideas in my head → Wispr Flow → words → Claude gives it shape ---- */
BUILD.story = (el, win) => {
  const IDEAS = ["my story","India","voice","FocusSpace","a 3D room","Play2Place","Golden Gate","my photos","a real MacBook","students","hackathons","a campaign"];
  const SAID = [
    ["#1","Build something that brings my story to life. Creativity, voice, ownership. Fast."],
    ["#2","Not approved. The colours are wrong, the layout is wrong. Make it interactive, real world."],
    ["#3","A real room you walk into. Me at my desk, my years on a timeline, a laptop that opens."],
    ["#4","Use my pictures. San Francisco view, a table, and me sitting there."],
    ["#5","The laptop should be a MacBook, logo shining, the real Mac interface."],
    ["#6","Show how I build with Wispr Flow. From an idea to a startup."]
  ];
  const SHAPES = [
    ["v1 · 3D desk", "no", "desk"], ["v2 · bright desktop", "no", "desk2"], ["v3 · a room", "ok", "room"],
    ["+ my photos", "ok", "photos"], ["+ SF view & me", "ok", "sf"], ["+ MacBook & macOS", "ok", "mac"]
  ];
  const art = k => ({
    desk:`<div style="position:absolute;inset:0;background:linear-gradient(#2a211a,#15110e);border-radius:6px"></div><div style="position:absolute;left:20%;right:20%;bottom:18%;height:10px;background:#7a5236;border-radius:3px"></div>`,
    desk2:`<div style="position:absolute;inset:0;background:linear-gradient(#9cc6ec,#ffc89c);border-radius:6px"></div><div style="position:absolute;left:30%;top:22%;width:40%;height:46%;background:#fff;border-radius:4px"></div>`,
    room:`<div style="position:absolute;inset:0;background:#ece6dc;border-radius:6px"></div><div style="position:absolute;left:18%;right:18%;top:12%;height:42%;background:linear-gradient(#9fbfdc,#f4d9bd);border:3px solid #2b2723;border-radius:3px"></div><div style="position:absolute;left:28%;right:28%;bottom:16%;height:6px;background:#c89f72"></div>`,
    photos:`<div style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px"><img src="photos/2.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:4px"><img src="photos/3.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:4px"><img src="photos/4.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:4px"></div>`,
    sf:`<img src="assets/sf-view.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px"><img src="photos/avatar.jpg" style="position:absolute;left:50%;bottom:4px;width:30px;height:30px;margin-left:-15px;border-radius:50%;border:2px solid #fff">`,
    mac:`<img src="assets/wallpaper.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px"><div style="position:absolute;left:25%;right:25%;bottom:6px;height:9px;border-radius:5px;background:rgba(255,255,255,.5)"></div>`
  })[k];
  el.style.overflow = "hidden";
  el.innerHTML = `<div class="mwf">
    <div class="cap"><small id="ck"></small><h2 id="ch"></h2></div>
    <img class="me" id="me" src="photos/1.jpg" alt="Utsav">
    <div id="ideas"></div>
    <div class="pill" id="pill"><img src="assets/wispr-flow-icon.png" alt=""><div class="bars">${"<i></i>".repeat(18)}</div><span id="pst">Listening…</span></div>
    <div class="app" id="app"><aside><div class="brand"><img src="assets/wispr-flow-icon.png" alt="">Flow</div><div class="on">Home</div><div>Dictionary</div><div>Snippets</div><div>Style</div><div>Notes</div><div class="sp"></div><div>Settings</div></aside>
      <main><h4>Home · my dictations</h4><div class="feed" id="feed"></div></main></div>
    <div class="shapes" id="shapes">${SHAPES.map(x=>`<div class="shape${x[1]==="ok"&&x[2]==="mac"?" win":""}"><div class="art">${art(x[2])}</div><b>${x[0]}</b><em class="${x[1]}">${x[1]==="no"?"NOPE":"YES"}</em></div>`).join("")}</div>
    <div class="final" id="final"><div class="stats"><div><b>6</b>rounds, spoken</div><div><b>3</b>full redesigns</div><div><b>14</b>apps on this Mac</div></div>
      <div class="row"><button class="btn" id="toBuild">Build your own thing →</button><a class="btn ghost" href="https://wisprflow.ai" target="_blank" rel="noopener">Download Wispr Flow ↗</a><button class="btn ghost" id="toDesk">Back to my desk</button></div></div>
    <div class="ctrl"><button id="pp">Pause</button><div class="dots" id="dots">${"<b><i></i></b>".repeat(5)}</div><button id="again">Replay</button></div>
  </div>`;
  const R = $(".mwf", el), me = $("#me", el), pill = $("#pill", el), app = $("#app", el), feed = $("#feed", el), shapes = $$(".shape", el), fin = $("#final", el), bars = $$("#pill .bars i", el);
  const CAPS = [["Step 1 · in my head","It all started as <i>ideas in my head.</i>"],["Step 2 · Wispr Flow","Then I let them <i>flow</i>, out loud."],["Step 3 · words","Wispr turned the ramble into <i>clear words.</i>"],["Step 4 · Claude","Claude gave the words a <i>shape.</i>"],["Step 5 · shipped","And it became <i>this.</i>"]];
  let timers = [], wave = null, scene = -1, paused = false;
  const T = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const W = () => R.clientWidth, H = () => R.clientHeight;
  // ideas
  const ideaEls = IDEAS.map((t,i) => { const d = document.createElement("div"); d.className = "idea"; d.textContent = t; $("#ideas", el).appendChild(d); return d; });
  const placeIdeas = () => ideaEls.forEach((d,i) => { const a = i/IDEAS.length*Math.PI*2, rx = Math.min(W()*.36, 300), ry = Math.min(H()*.27, 150);
    d.style.left = (W()/2 + Math.cos(a)*rx - 50) + "px"; d.style.top = (H()*.52 + Math.sin(a)*ry - 14) + "px"; d.style.animationDelay = (-i*.4)+"s"; });
  const waveOn = on => { clearInterval(wave); if (on) wave = setInterval(() => bars.forEach(b => b.style.height = (4 + Math.random()*18) + "px"), 90); else bars.forEach(b => b.style.height = "4px"); };
  const reset = () => { clear(); waveOn(false); me.style.opacity = 1; me.style.transform = ""; ideaEls.forEach(d => d.className = "idea"); placeIdeas();
    pill.classList.remove("in"); app.classList.remove("in"); feed.innerHTML = ""; shapes.forEach(s => s.classList.remove("in")); fin.classList.remove("in"); };
  const dots = $$("#dots b", el);
  const show = k => {
    scene = k; reset();
    $("#ck", el).textContent = CAPS[k][0]; $("#ch", el).innerHTML = CAPS[k][1];
    dots.forEach((d,i) => { d.classList.toggle("done", i < k); const bar = $("i", d); bar.style.transition = "none"; bar.style.width = i < k ? "100%" : "0"; });
    const cur = $("i", dots[k]); requestAnimationFrame(() => { cur.style.transition = paused ? "none" : `width ${DUR[k]}ms linear`; cur.style.width = paused ? "0" : "100%"; });
    if (k === 0){ ideaEls.forEach((d,i) => T(() => d.classList.add("in"), 200 + i*260)); }
    if (k === 1){ ideaEls.forEach(d => d.classList.add("in")); pill.classList.add("in"); waveOn(true); $("#pst", el).textContent = "Listening…";
      ideaEls.forEach((d,i) => T(() => { const pr = pill.getBoundingClientRect(), rr = R.getBoundingClientRect(); d.style.left = (pr.left - rr.left + pr.width/2 - 40) + "px"; d.style.top = (pr.top - rr.top) + "px"; d.classList.add("gone"); }, 600 + i*280));
      T(() => { me.style.opacity = .25; $("#pst", el).textContent = "Flowing…"; }, 3000); }
    if (k === 2){ me.style.opacity = 0; ideaEls.forEach(d => d.classList.add("gone")); pill.classList.add("in"); waveOn(true); app.classList.add("in");
      SAID.forEach((x,i) => T(() => { feed.appendChild(h(`<div class="row2"><time>${x[0]}</time><div>${x[1]}</div></div>`)); if (feed.children.length > 4) feed.firstElementChild.remove(); }, 400 + i*900));
      T(() => waveOn(false), 400 + SAID.length*900); }
    if (k === 3){ me.style.opacity = 0; ideaEls.forEach(d => d.classList.add("gone")); shapes.forEach((s,i) => T(() => s.classList.add("in"), 300 + i*650)); }
    if (k === 4){ me.style.opacity = 1; me.style.transform = "translateY(-70px) scale(.8)"; ideaEls.forEach(d => d.classList.add("gone")); T(() => fin.classList.add("in"), 300); }
    if (!paused && k < 4) T(() => show(k+1), DUR[k]);
  };
  const DUR = [4200, 5200, 6600, 5600, 99999];
  dots.forEach((d,i) => d.onclick = () => show(i));
  $("#pp", el).onclick = () => { paused = !paused; $("#pp", el).textContent = paused ? "Play" : "Pause"; if (!paused) show(scene === 4 ? 0 : scene + 1); else clear(); };
  $("#again", el).onclick = () => { paused = false; $("#pp", el).textContent = "Pause"; show(0); };
  $("#toBuild", el).onclick = () => openApp("build");
  $("#toDesk", el).onclick = () => { try { parent.postMessage("close-laptop", "*"); } catch(e){} };
  addEventListener("resize", placeIdeas);
  win._cleanup = () => { clear(); waveOn(false); removeEventListener("resize", placeIdeas); };
  requestAnimationFrame(() => show(0));
};


/* ---------- guided tour: the room runs it, the laptop shows each app ---------- */
let tourOn = false;
const TP = () => { try { return (parent !== window && parent.TourAPI) || null; } catch(e){ return null; } };
window.tourShow = st => {
  tourOn = true; $("#tour").hidden = false; $("#notif").classList.remove("show"); $("#appleMenu").classList.remove("open");
  Object.keys(opened).filter(id => id !== st.app).forEach(id => closeWin(id));
  openApp(st.app);
  $("#tourN").textContent = st.n; $("#tourM").textContent = st.total; $("#tourT").textContent = st.t;
  $("#tourNext").textContent = st.last ? "Finish ✓" : "Next →";
  const p = $("#tourP"); p.style.animation = "none"; void p.offsetWidth; p.style.animation = `tourp ${st.ms}ms linear forwards`;
  tourPlaying(st.playing);
  toast(`${st.n}/${st.total} · ${st.d}`, 4200);
};
window.tourPlaying = on => { $("#tourP").style.animationPlayState = on ? "running" : "paused"; $("#tourPlay").textContent = on ? "❚❚" : "▶"; };
window.tourHide = done => { if (!tourOn) return; tourOn = false; $("#tour").hidden = true; if (done) toast("Thanks for taking the tour. Everything else is in the Dock.", 3600); };
$("#tourNext").onclick = () => TP() && TP().next();
$("#tourPrev").onclick = () => TP() && TP().prev();
$("#tourPlay").onclick = () => TP() && TP().toggle();
$("#tourX").onclick = () => TP() ? TP().end() : tourHide();

/* first run: Notes with "About me", and a welcome notification */
setTimeout(() => { if (!tourOn) openApp("notes"); }, 250);
setTimeout(() => { if (!tourOn) $("#notif").classList.add("show"); }, 900);
setTimeout(() => $("#notif").classList.remove("show"), 7000);
$("#notif").onclick = () => { $("#notif").classList.remove("show"); openApp("notes"); };
</script>
</body>
